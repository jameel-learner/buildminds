<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" fill="none">
  <!-- Brain Outer Contour & Anatomical Gyri in Crisp White -->
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Brain Contour (Frontal, Parietal, Occipital, Temporal, Cerebellum) -->
    <path
      d="M 170 45 C 205 32 245 28 285 32 C 330 36 375 52 410 82 C 445 112 470 152 472 195 C 474 225 464 252 446 274 C 430 292 415 310 405 332 C 392 358 372 380 346 392 C 326 400 305 388 296 368 C 286 346 280 322 262 312 C 242 302 220 306 200 312 C 172 320 144 322 120 308 C 96 294 78 268 68 240 C 60 216 48 198 32 188 C 20 178 15 162 18 144 C 22 122 36 104 56 90 C 80 72 120 58 170 45 Z"
      stroke-width="11"
    />

    <!-- Internal Gyri / Lobular Sulci Lines (matching white_logo_svg_copy.svg) -->
    <!-- Frontal lobe / sulcus framing brackets -->
    <path d="M 120 72 C 145 105 138 145 110 172" stroke-width="8" stroke-opacity="0.9" />
    <path d="M 175 45 C 195 85 185 125 155 155" stroke-width="8" stroke-opacity="0.9" />
    
    <!-- Central sulcus between < > brackets and top-right gear -->
    <path d="M 285 32 C 290 85 305 130 340 155" stroke-width="9" stroke-opacity="0.9" />
    
    <!-- Parieto-occipital fissure framing top-right gear -->
    <path d="M 375 52 C 385 95 415 130 450 145" stroke-width="8" stroke-opacity="0.85" />
    <path d="M 472 195 C 435 220 395 225 365 240" stroke-width="8" stroke-opacity="0.85" />

    <!-- Lateral / Sylvian fissure separating temporal lobe from central gear -->
    <path d="M 68 240 C 95 220 135 212 175 224" stroke-width="8" stroke-opacity="0.9" />
    <path d="M 120 308 C 140 275 165 255 200 252" stroke-width="8" stroke-opacity="0.85" />

    <!-- Cerebellar folia and lower fissures -->
    <path d="M 446 274 C 410 285 375 282 345 295" stroke-width="8" stroke-opacity="0.9" />
    <path d="M 405 332 C 375 338 340 332 315 348" stroke-width="8" stroke-opacity="0.85" />
  </g>

  <!-- Golden Code Brackets < > (Color #D98A1E) -->
  <g stroke="#D98A1E" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left angle bracket < -->
    <path d="M 224 88 L 192 120 L 224 152" />
    <!-- Right angle bracket > -->
    <path d="M 244 88 L 276 120 L 244 152" />
  </g>

